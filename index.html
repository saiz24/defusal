<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MATHEMATICKS</title>

<!-- installable: an icon on the home screen, fullscreen, and it keeps
     working with no connection once it has been opened once -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b1115">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MATHEMATICKS">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="style.css?v=20260924a">
</head>
<body>
<div id="backdrop" class="backdrop"></div>
<div id="flash" class="flash"></div>

<!-- Shown only on a portrait handset while a round or the opening is running.
     The casing is a wide object; squeezed into a tall frame the ruler and
     cylinder gradations stop being readable. -->
<div id="rotate-hint" aria-hidden="true">
  <div class="rot-glyph"></div>
  <p>Turn your device sideways.</p>
</div>

<!-- ======================= OPENING ======================= -->
<!-- The opening fills the glass. It is the drawing INSIDE it that is held off
     the edges — by padding on the picture, not by a box around it — so the
     scene has air without the screen growing a frame. The ghost layer holds
     the outgoing scene so one beat dissolves into the next. -->
<section id="cutscene" class="cutscene" hidden>
  <div id="cs-ghost" class="cs-stage cs-ghost" aria-hidden="true"></div>
  <div id="cs-art" class="cs-stage"></div>
  <div class="cs-box">
    <p id="cs-text" class="voice cs-line"></p>
    <span id="cs-prompt" class="cs-prompt"></span>
  </div>
  <button type="button" id="cs-begin" class="cs-begin" hidden>BEGIN</button>
  <button type="button" id="cs-skip" class="cs-skip">SKIP &#9656;</button>
</section>

<!-- ======================= MODE SELECT =======================
     Handed to the player the moment the opening lets go, and reachable again
     from the menu. The three modes are a row of keys along the bottom; above
     them a panel shows what each one actually looks like once a device is
     armed, because "two devices" and "solo" mean nothing until you have seen
     the shape of them. -->
<section id="screen-mode" class="screen menu" hidden>
  <div class="sheet mode-sheet">
    <h2 class="mode-heading">MODE</h2>

    <div class="mode-stage">
      <div class="mode-track" id="mode-track"></div>
    </div>

    <div class="mode-opts" id="mode-opts" hidden></div>

    <div class="mode-row" id="mode-row" role="group" aria-label="mode"></div>

    <div class="mode-go">
      <button type="button" id="mode-back" class="sound" hidden>BACK</button>
      <button type="button" id="mode-confirm" class="key go"><b>CONTINUE</b></button>
    </div>
  </div>
</section>

<!-- ======================= MENU ======================= -->
<section id="screen-menu" class="screen menu">
  <div class="sheet">
    <h1 class="title">MATHEMATICKS</h1>

    <div class="select">
      <button type="button" class="nav" id="sel-prev" aria-label="previous">&#8249;</button>
      <div class="viewport"><div class="track" id="sel-track"></div></div>
      <button type="button" class="nav" id="sel-next" aria-label="next">&#8250;</button>
    </div>
    <div class="sel-dots" id="sel-dots"></div>

    <!-- kept in the document so their ids survive; moved into their pages -->
    <div id="templates" hidden>
      <div id="seed-panel" class="practice seedbox">
        <label class="field wide"><span>CODE</span>
          <input id="seed-code" type="text" autocomplete="off" spellcheck="false"
                 autocapitalize="characters" placeholder="S3-K7A2XQ"></label>
        <p class="seed-note" id="seed-note" hidden></p>
        <button type="button" id="seed-start" class="key go"><b>ENGAGE</b></button>
      </div>
      <div id="practice-panel" class="practice">
        <label class="field"><span>MODULES</span>
          <input id="practice-modules" type="number" min="1" max="8" value="4"></label>
        <label class="field"><span>MINUTES</span>
          <input id="practice-minutes" type="number" min="1" max="30" value="8"></label>
        <button type="button" id="practice-start" class="key go"><b>ENGAGE</b></button>
      </div>
    </div>

    <p id="progress" class="progress"></p>

    <!-- Two controls, not four in a row. ENGAGE on the card is the thing to
         press; MODE is the only other decision that changes how the game is
         played, so it is the only other thing given weight here. Everything
         else is housekeeping and lives behind SETTINGS. -->
    <div class="minor">
      <button type="button" id="mode-open" class="key wide-key">
        <b>MODE</b><i id="mode-now">PRINTED</i>
      </button>
      <button type="button" id="settings-open" class="icon-key" title="settings"
              aria-label="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="3.2"></circle>
          <path d="M12 3.6v2.2M12 18.2v2.2M20.4 12h-2.2M5.8 12H3.6M18 6l-1.6 1.6M7.6 16.4 6 18M18 18l-1.6-1.6M7.6 7.6 6 6"></path>
        </svg>
      </button>
    </div>
  </div>
</section>

<!-- ======================= SETTINGS =======================
     Everything that is not a decision about how to play. It was a row of
     equal-weight buttons under the device carousel, which put RESET PROGRESS
     the same distance from the eye as the thing you actually came to press. -->
<section id="screen-settings" class="screen menu" hidden>
  <div class="sheet set-sheet">
    <h2 class="set-heading">SETTINGS</h2>

    <div class="set-list">
      <div class="set-row">
        <b>SOUND</b>
        <button type="button" id="sound" class="opt-btn">ON</button>
      </div>

      <!-- Three levels, the ones every game has: all of it, the music bed,
           and the effects (keys, the clock, strikes). Each shows its value
           the way the clock does, and moving one plays a sample of it. -->
      <div class="set-row set-slide">
        <b id="lbl-volume">VOLUME</b>
        <input type="range" id="vol-volume" class="slider" min="0" max="100" step="1"
               data-level="volume" aria-labelledby="lbl-volume">
        <span class="set-val" id="val-volume">100</span>
      </div>
      <div class="set-row set-slide">
        <b id="lbl-music">MUSIC</b>
        <input type="range" id="vol-music" class="slider" min="0" max="100" step="1"
               data-level="music" aria-labelledby="lbl-music">
        <span class="set-val" id="val-music">70</span>
      </div>
      <div class="set-row set-slide">
        <b id="lbl-effects">EFFECTS</b>
        <input type="range" id="vol-effects" class="slider" min="0" max="100" step="1"
               data-level="effects" aria-labelledby="lbl-effects">
        <span class="set-val" id="val-effects">100</span>
      </div>

      <div class="set-row">
        <b>OPENING</b>
        <button type="button" id="replay-intro" class="opt-btn">REPLAY</button>
      </div>

      <div class="set-row danger">
        <b>PROGRESS</b>
        <span id="set-progress" class="set-val">0 / 5</span>
        <button type="button" id="reset-progress" class="opt-btn bad">RESET</button>
      </div>
    </div>

    <div class="mode-go">
      <button type="button" id="settings-back" class="key go"><b>DONE</b></button>
    </div>
  </div>
</section>

<!-- ======================= BOMB ======================= -->
<section id="screen-game" class="screen deck" hidden>
  <p id="arming-line" class="voice arming-line"></p>
  <button type="button" id="wide-btn" class="flip-btn wide-btn" data-wide
          title="pull back from the case">
    <svg class="w-out" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"></circle><path d="M20 20l-4.5-4.5M8 11h6"></path></svg>
    <svg class="w-in" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"></circle><path d="M20 20l-4.5-4.5M8 11h6M11 8v6"></path></svg>
  </button>
  <button type="button" id="flip-btn" class="flip-btn" data-flip
          title="turn the case over">
    <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 1 2.6 5.9"></path><path d="M3 19v-6h6"></path></svg>
  </button>
  <!-- Touch only. Focusing a module on a phone pushes the case's own control
       strip off the top of the screen, and a countdown you cannot see is not a
       countdown. This is the same clock, pinned to the glass. -->
  <div id="focus-clock" class="focus-clock" hidden>
    <span id="focus-clock-time">00:00</span>
    <span id="focus-clock-count" class="fc-count">0/0</span>
  </div>
  <div id="bomb" class="bomb">
    <div id="flipper" class="flipper">

      <div class="face front">
        <div class="casing" data-face="0">
          <div class="chassis"></div>
          <div class="panel"></div>
          <div class="bays"></div>
          <div class="scrim"></div>
        </div>
      </div>

      <div class="face back">
        <div class="casing" data-face="1">
          <div class="chassis"></div>
          <div class="panel"></div>
          <div class="bays"></div>
          <div class="scrim"></div>
        </div>
      </div>

    </div>
  </div>
</section>

<!-- ============ THE MANUAL, BESIDE THE DEVICE (SOLO) ============
     Solo used to hide the case behind a full-screen manual and charge the
     player time for looking. It is a split screen now: both halves are on
     the glass at once, either half can take all of it, and the split can be
     turned. It starts vertical. -->
<aside id="play-manual" class="play-manual" hidden></aside>

<!-- The divider. Drag it to give either half more of the glass; double-click
     puts it back in the middle. Body-level like the bar below, and only ever
     shown while both halves are up. -->
<div id="split-grip" class="split-grip" hidden role="separator"
     aria-label="drag to resize the split" tabindex="0"></div>

<!-- The split controls. Body-level, because when the manual has the whole
     screen there is no bomb pane left to carry the control that brings the
     bomb back. -->
<div id="layout-bar" class="layout-bar" hidden role="group" aria-label="screen layout">
  <button type="button" class="lay-btn" id="lay-bomb" title="the device, full screen">DEVICE</button>
  <button type="button" class="lay-btn" id="lay-both" title="both halves">SPLIT</button>
  <button type="button" class="lay-btn" id="lay-manual" title="the manual, full screen">MANUAL</button>
  <button type="button" class="lay-btn lay-turn" id="lay-turn" title="turn the split">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <rect x="3" y="4" width="18" height="16" rx="2"></rect>
      <path class="lay-v" d="M12 4v16"></path>
      <path class="lay-h" d="M3 12h18"></path>
    </svg>
  </button>
</div>

<!-- ============ THE MANUAL, AS THE WHOLE SCREEN (TWO DEVICES) ============
     This screen IS the manual. There is no bomb on it and there never was a
     link to follow: the second player picked MANUAL on the mode screen and
     this is what that means. -->
<section id="screen-reader" class="screen reader" hidden>
  <div id="reader-host" class="reader-host"></div>
  <button type="button" id="reader-back" class="sound reader-back">CHANGE THIS SCREEN</button>
</section>

<!-- ======================= RESULT =======================
     One sheet, read top to bottom: what happened, the numbers, what to do
     next, and last the code — which had been a loose line of text with a
     button floating beside it. -->
<section id="screen-result" class="screen menu" hidden>
  <div class="sheet result-sheet">
    <h2 id="result-title" class="verdict">DEFUSED</h2>
    <p id="result-cause" class="cause"></p>

    <div id="result-stats" class="stats"></div>

    <div class="choices two">
      <button type="button" id="result-continue" class="key" hidden><b>CONTINUE</b></button>
      <button type="button" id="result-replay" class="key"><b>TRY AGAIN</b></button>
      <button type="button" id="result-menu" class="key"><b>MENU</b></button>
    </div>

    <div class="code-plate">
      <div class="code-head">
        <span class="code-label">DEVICE CODE</span>
        <span id="result-detail" class="code-detail"></span>
      </div>
      <div class="code-row">
        <code id="result-seed" class="seed-code"></code>
        <button type="button" id="result-copy" class="opt-btn">COPY</button>
      </div>
    </div>
  </div>
</section>

<script src="js/fx.js?v=20260924a"></script>

<script src="js/modules/angles.js?v=20260924a"></script>

<script src="manual/rules.js?v=20260924a"></script>
<script src="manual/render.js?v=20260924a"></script>
<script src="js/zoom.js?v=20260924a"></script>
<script src="js/manual-view.js?v=20260924a"></script>

<script>
/* Service workers need a real origin, so this simply does not run when the
   page is opened by double-clicking the file — which needs no offline help
   anyway, the files are already on the disk. */
if ('serviceWorker' in navigator && location.protocol.slice(0, 4) === 'http') {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
</body>
</html>
