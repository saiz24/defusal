<!doctype html>
<meta charset="utf-8">
<title>audio levels</title>
<!-- Renders every sound in the kit offline and reports its peak and loudness,
     so a change to the mix is measured, not judged by ear on one laptop.
       "Google Chrome" --headless=new --allow-file-access-from-files \
         --virtual-time-budget=20000 --dump-dom file://.../tools/measure-audio.html
     Loaded fresh per sound: audio.js keeps one context for its whole life. -->
<pre id="out">running</pre>
<script>
window.onerror = function (m) { document.getElementById('out').textContent += '\nERR ' + m; };
function log(m) { document.getElementById('out').textContent += '\n' + m; }
var SOUNDS = ['click', 'press', 'relay', 'beep0', 'beep1', 'flip', 'zoom',
              'push', 'boot', 'whoosh', 'solve', 'strike', 'defused', 'exploded',
              'intro', 'powerdown', 'music'];
var VOL = Number((location.search.match(/vol=([\d.]+)/) || [])[1] || 1);
var SR = 48000, SECS = 4;

/* A <script> per sound, not fetch(): file:// refuses to fetch a local file. */
function fresh(D, win) {
  return new Promise(function (ok, bad) {
    window.DEFUSAL = D;
    window.__win = win;
    var el = document.createElement('script');
    el.src = '../js/audio.js?' + Math.random();
    el.onload = ok; el.onerror = bad;
    document.head.appendChild(el);
  });
}

function render(name) {
  var off = new OfflineAudioContext(2, SR * SECS, SR);
  var fake = function () { return off; };
  var D = {};
  var win = { AudioContext: fake, localStorage: { getItem: function (k) {
    return k === 'defusal.volume' ? String(VOL) : null; }, setItem: function () {} } };
  window.AudioContext = fake;
  return fresh(D, win).then(function () {
  var A = D.audio;
  A.unlock();
  if (name === 'music') A.music(true);
  else if (name === 'beep0') A.beep(0);
  else if (name === 'beep1') A.beep(1);
  else if (name === 'boot') A.boot([0, 90, 180], 950);
  else A[name]();
  log('rendering ' + name);
  return off.startRendering().then(function (buf) {
    var d = buf.getChannelData(0), peak = 0, sum = 0, n = 0, i, w, best = 0;
    for (i = 0; i < d.length; i++) peak = Math.max(peak, Math.abs(d[i]));
    /* loudest 100ms window, RMS: what the ear calls "how loud" */
    var W = SR / 10;
    for (w = 0; w + W <= d.length; w += W / 2) {
      sum = 0;
      for (i = w; i < w + W; i++) sum += d[i] * d[i];
      best = Math.max(best, Math.sqrt(sum / W));
    }
    function db(x) { return x > 0 ? (20 * Math.log10(x)).toFixed(1) : '-inf'; }
    return name + '\tpeak ' + db(peak) + ' dBFS\tloudest100ms ' + db(best) + ' dBFS';
  });
  });
}

try { localStorage.setItem('defusal.volume', String(VOL)); } catch (e) {}
Promise.resolve().then(function () {
  var lines = [];
  return SOUNDS.reduce(function (p, s) {
    return p.then(function () { return render(s); })
            .then(function (l) { lines.push(l); });
  }, Promise.resolve()).then(function () {
    document.getElementById('out').textContent = 'vol=' + VOL + '\n' + lines.join('\n');
  });
}).catch(function (e) { document.getElementById('out').textContent = 'ERR ' + e; });
</script>
