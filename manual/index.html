<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MATHEMATICKS — The Manual</title>
<link rel="stylesheet" href="../style.css">
<style>
/* ==========================================================================
   THE DIGITAL MANUAL
   The Expert's half of the game. It is a separate document on purpose: in
   two-device mode it opens on a second phone, so the Defuser's screen is
   still the only place the device can be seen.
   Every word here is extracted from the printed manual by
   tools/extract-manual.py — nothing is retyped, so the two cannot drift.
   ========================================================================== */
html, body { height: auto; overflow: auto; }
body {
  background: #0b1115;
  color: var(--text);
  padding: 0 0 80px;
  -webkit-text-size-adjust: 100%;
}
a { color: var(--rim); }

/* ---- top bar ---- */
.bar {
  position: sticky; top: 0; z-index: 30;
  background: rgba(11,17,21,.96);
  border-bottom: 1px solid #22323a;
  padding: 12px max(16px, env(safe-area-inset-left)) 12px max(16px, env(safe-area-inset-right));
  padding-top: calc(12px + env(safe-area-inset-top, 0px));
}
.bar-row { display: flex; gap: 12px; align-items: center;
           max-width: 1080px; margin: 0 auto; flex-wrap: wrap; }
.brand { font-size: 15px; letter-spacing: .18em; color: var(--rim); white-space: nowrap; }
.count { font-size: 12px; color: var(--ink-2); white-space: nowrap; }

/* ---- contents ---- */
.wrap { max-width: 1080px; margin: 0 auto;
        padding: 0 max(16px, env(safe-area-inset-left)); }
.toc { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 26px; }
.toc a {
  display: inline-block; padding: 8px 13px; min-height: 40px;
  border: 1px solid #2b3d46; border-radius: 999px;
  font-size: 13px; text-decoration: none; color: var(--text);
  background: #131f26; line-height: 24px;
}
.toc a:hover { border-color: var(--rim); }
.toc a .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
              margin-right: 7px; vertical-align: middle; }

.lede { font-size: 14px; color: var(--ink-2); line-height: 1.6;
        margin: 18px 0 0; max-width: 62ch; }

/* ---- a module ---- */
.mod { border-top: 1px solid #22323a; padding: 30px 0 10px; scroll-margin-top: 84px; }
.mod-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.mod h2 { margin: 0; font-size: 26px; letter-spacing: .02em; }
.badge {
  font-size: 11px; letter-spacing: .16em; text-transform: uppercase;
  border: 1px solid; border-radius: 6px; padding: 3px 9px;
}
.badge.easy   { color: #6cc48a; border-color: #36624a; }
.badge.medium { color: #e0b552; border-color: #6b5628; }
.badge.hard   { color: #e0766c; border-color: #6e3b36; }
.tagline { margin: 6px 0 0; color: var(--ink-2); font-style: italic; font-size: 15px; }

/* ---- the live example ---- */
.example { margin: 20px 0 6px; }
.example-head {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
  color: var(--ink-2); margin-bottom: 10px;
}
.example-head button {
  font-family: var(--round); font-size: 12px; letter-spacing: .1em;
  background: #1b2a33; color: var(--text);
  border: 1px solid #33495459; border-radius: 8px;
  padding: 7px 13px; min-height: 36px; cursor: pointer;
}
.example-head button:hover { border-color: var(--rim); color: var(--rim); }
.serial-chip { color: var(--rim); letter-spacing: .22em; }
.stage {
  background: #7f9198; border-radius: 14px; padding: 12px;
  overflow-x: auto; -webkit-overflow-scrolling: touch;
}
.stage .bay { position: relative; }
.note {
  font-size: 12px; color: var(--ink-2); margin: 8px 0 0; line-height: 1.55;
}

/* ---- the rules ---- */
.rules { margin-top: 8px; max-width: 74ch; }
.rules p { line-height: 1.62; margin: 13px 0; }
.rules p.h { font-size: 17px; font-weight: 700; color: #dbe9ee;
             margin: 26px 0 6px; letter-spacing: .01em; }
.rules p.attn { color: var(--amber); font-weight: 700; letter-spacing: .06em;
                margin: 24px 0 4px; }
.rules li { line-height: 1.62; margin: 7px 0; }
.rules ul { padding-left: 22px; margin: 10px 0; }
.rules b { color: #fff; }
.tablewrap { overflow-x: auto; margin: 14px 0; -webkit-overflow-scrolling: touch; }
.rules table { border-collapse: collapse; font-size: 14px; min-width: 100%; }
.rules th, .rules td {
  border: 1px solid #2b3d46; padding: 7px 11px; text-align: left;
  white-space: nowrap;
}
.rules thead th { background: #16232b; color: #cfe3ea; font-weight: 700; }
.rules tbody tr:nth-child(even) { background: rgba(255,255,255,.022); }
.rules tr.subhead th { background: #16232b; color: #cfe3ea; font-weight: 700; }


@media (max-width: 700px) {
  .mod h2 { font-size: 22px; }
  .rules p, .rules li { font-size: 15px; }
  .brand { font-size: 13px; }
}

@media print {
  .bar, .toc { display: none !important; }
  body { background: #fff; color: #000; }
  .mod { break-inside: avoid; border-top: 1px solid #999; }
  .rules b, .rules p.h { color: #000; }
  .rules th, .rules td { border-color: #666; }
  .rules thead th { background: #eee; color: #000; }
}
</style>
</head>
<body>

<div class="bar">
  <div class="bar-row">
    <span class="brand">MATHEMATICKS · MANUAL</span>
    <span class="count" id="count"></span>
  </div>
</div>

<div class="wrap">
  <!-- No illustrations. The Expert never sees the device, and a drawing of a
       module here only invites them to match one by eye instead of asking the
       Defuser to describe it — which is the competency this game exists to
       drill. The game now carries the manual itself (manual/manual.pdf), so
       this page is for reading it on anything, and for printing. -->
  <p class="lede">
    The Expert holds this. The Defuser holds the device and may not read it;
    you may not look at the device. Modules are not labelled on the device —
    find yours by what the Defuser describes.
  </p>
  <nav class="toc" id="toc"></nav>
  <main id="mods"></main>
</div>

<script src="../js/core.js"></script>
<script src="../js/audio.js"></script>
<script src="../js/svg.js"></script>
<script src="../js/modules/cards.js"></script>
<script src="../js/modules/sequences.js"></script>
<script src="../js/modules/mutex.js"></script>
<script src="../js/modules/rationality.js"></script>
<script src="../js/modules/parallel.js"></script>
<script src="../js/modules/venn.js"></script>
<script src="../js/modules/triangles.js"></script>
<script src="../js/modules/angles.js"></script>
<script src="../js/modules/units.js"></script>
<script src="../js/modules/units-render.js"></script>
<script src="rules.js"></script>
<script src="render.js"></script>
<script>
(function () {
  'use strict';
  /* No search, here or in the game. Searching the manual turns it into a
     lookup table — type the word the Defuser just said, read back the line
     that matched — and the Expert is supposed to read the module's section.
     The contents above are how a module is found by name. */
  var toc = document.getElementById('toc');
  var mods = document.getElementById('mods');
  MANUAL_RENDER.toc(toc);
  var sections = MANUAL_RENDER.build(mods, { examples: false });
  document.getElementById('count').textContent = sections.length + ' modules';
})();
</script>
</body>
</html>
